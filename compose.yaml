name: agrosync-backend

services:
  backend:
    restart: unless-stopped
    build: .
    user: "${AGROSYNC_RUN_UID:-1000}:${AGROSYNC_RUN_GID:-1000}"
    environment:
      SERVER_PORT: "${SERVER_PORT:-8081}"
      SERVER_ADDRESS: 0.0.0.0
      AGROSYNC_OFFLINE_TTL: "${AGROSYNC_OFFLINE_TTL:-24h}"
      AGROSYNC_OAUTH_CLIENT_ID: "${AGROSYNC_OAUTH_CLIENT_ID:-}"
      AGROSYNC_OAUTH_CLIENT_SECRET: "${AGROSYNC_OAUTH_CLIENT_SECRET:-}"
      AGROSYNC_CRM_PUBLIC_URL: "${AGROSYNC_CRM_PUBLIC_URL:-http://127.0.0.1:8080}"
      AGROSYNC_OAUTH_CALLBACK: "${AGROSYNC_OAUTH_CALLBACK:-http://127.0.0.1:8081/api/v1/auth/callback}"
      AGROSYNC_FRONTEND_ORIGIN: "${AGROSYNC_FRONTEND_ORIGIN:-http://127.0.0.1:5173}"
      SUITECRM_BASE_URL: "${SUITECRM_DOCKER_BASE_URL:-http://app:80}"
      SUITECRM_CLIENT_ID: "${SUITECRM_CLIENT_ID:?Configura SUITECRM_CLIENT_ID}"
      SUITECRM_CLIENT_SECRET: "${SUITECRM_CLIENT_SECRET:?Configura SUITECRM_CLIENT_SECRET}"
      SUITECRM_CONNECT_TIMEOUT: "${SUITECRM_CONNECT_TIMEOUT:-3s}"
      SUITECRM_READ_TIMEOUT: "${SUITECRM_READ_TIMEOUT:-5s}"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    networks:
      - suitecrm

networks:
  suitecrm:
    external: true
    name: "${SUITECRM_DOCKER_NETWORK:-suitecrm810_default}"
